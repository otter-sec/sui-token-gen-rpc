[package]
name = "sui-token-gen-rpc"
version = "0.16.0"
rust-version = "1.70.0"
authors = []
edition = "2021"
license = "MIT"
documentation = "https://docs.rs/sui-token-gen-rpc"
homepage = "https://github.com/google/tarpc"
repository = "https://github.com/google/tarpc"
keywords = ["rpc", "network", "server", "microservices", "example"]
categories = ["asynchronous", "network-programming"]
readme = "README.md"
description = "A server application built using Tarpc, designed for token generation and verification with RPC and REST capabilities."

[dependencies]
anyhow = "1.0"
axum = { version = "0.7", features = ["json"] }
clap = { version = "4.4.18", features = ["derive"] }
log = "0.4"
futures = "0.3"
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio"] }
opentelemetry = { version = "0.26.0" }
opentelemetry-otlp = "0.26.0"
rand = "0.8.5"
tarpc = { version = "0.35", features = ["full"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tracing = { version = "0.1" }
tracing-opentelemetry = "0.27.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry_sdk = { version = "0.26.0", features = ["rt-tokio"] }
opentelemetry-semantic-conventions = "0.16.0"
tera = "1.20"
toml = "0.8.19"
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.4", features = ["full"] }
tower_governor = { version = "0.0.4" }
chrono = "0.4.38"
inquire = "=0.0.7"
url = "2.5.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11.1"
reqwest = "0.12.9"
git2 = "0.17"
thiserror = "2.0.4"
async-trait = "0.1.83"
openssl = { version = "0.10", features = ["vendored"] }
once_cell = "1.20.2"
dotenv = { version = "0.15" }
envy = "0.4.2"

[lib]
name = "service"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/server.rs"

[[bin]]
name = "client"
path = "src/client.rs"
